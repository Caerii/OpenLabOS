name: Build Device APKs

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build all modules
        working-directory: apps/device-reference
        run: ./gradlew assembleDebug

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          cp apps/device-reference/core-app/build/outputs/apk/debug/core-app-debug.apk artifacts/
          cp apps/device-reference/camera/build/outputs/apk/debug/camera-debug.apk artifacts/
          cp apps/device-reference/dashboard-device/build/outputs/apk/debug/dashboard-device-debug.apk artifacts/
          cp apps/device-reference/devtools/build/outputs/apk/debug/devtools-debug.apk artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openlabos-apks
          path: artifacts/

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
