name: Check

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  api-web-and-sidecar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies
        run: |
          pnpm --filter @openlabos/protocol build
          pnpm --filter @openlabos/preview build
          pnpm --filter @openlabos/sdk-ts build
          pnpm --filter @openlabos/device-android build

      - name: Install perception smoke dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r services/perception/requirements-smoke.txt

      - name: Lint
        run: pnpm lint

      - name: Typecheck API
        run: pnpm --filter @openlabos/api typecheck

      - name: Typecheck web
        run: pnpm --filter @openlabos/web typecheck

      - name: Typecheck desktop package
        run: pnpm --filter @openlabos/desktop typecheck

      - name: Test protocol package
        run: pnpm --filter @openlabos/protocol test

      - name: Test preview package
        run: pnpm --filter @openlabos/preview test

      - name: Test Android adapter package
        run: pnpm --filter @openlabos/device-android test

      - name: Test webcam adapter package
        run: pnpm --filter @openlabos/device-webcam test

      - name: Run API core Vitest suite
        run: pnpm --filter @openlabos/api test:core

      - name: Run API offline tests
        run: pnpm --filter @openlabos/api test:offline

      - name: Inference pytest
        working-directory: services/inference
        run: |
          pip install uv
          uv sync --python 3.12
          uv run pytest -q

      - name: Eval pytest
        working-directory: services/eval
        run: |
          pip install uv
          uv sync --python 3.12
          uv run pytest -q

      - name: Smoke perception sidecar
        run: .venv/bin/python scripts/check-sidecar-smoke.py

      - name: Audit Node dependencies
        run: pnpm audit --audit-level=high || true

      - name: Build web
        run: pnpm --filter @openlabos/web build

      - name: Build API
        run: pnpm --filter @openlabos/api build

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Compose definition
        run: docker compose config --quiet

      - name: Validate GPU Compose overlay
        run: docker compose -f compose.yaml -f compose.gpu.yaml config --quiet

      - name: Build and start local stack
        run: docker compose up --build --wait

      - name: Smoke all services
        run: node scripts/compose-smoke.mjs

      - name: Protocol-run E2E
        run: node scripts/compose-protocol-run.mjs

      - name: Restart persistence check
        run: node scripts/compose-restart-persistence.mjs

      - name: Print service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop local stack
        if: always()
        run: docker compose down --volumes

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  device-editions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: dtolnay/rust-toolchain@stable

      - name: Test Go device edition
        working-directory: apps/device-reference/editions/go
        run: go test ./...

      - name: Build Rust device edition
        working-directory: apps/device-reference/editions/rust
        run: cargo build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APKs
        working-directory: apps/device-reference
        run: ./gradlew assembleDebug
