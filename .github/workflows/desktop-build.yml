name: Desktop Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/desktop-build.yml"
      - "desktop/**"
      - "apps/web/**"
      - "services/api/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact_name: openlabos-desktop-windows
            artifact_glob: |
              desktop/src-tauri/target/release/bundle/msi/*.msi
              desktop/src-tauri/target/release/bundle/nsis/*.exe
          - name: macOS Apple Silicon
            os: macos-latest
            artifact_name: openlabos-desktop-macos-arm64
            artifact_glob: |
              desktop/src-tauri/target/release/bundle/dmg/*.dmg
              desktop/src-tauri/target/release/bundle/macos/*.app
          - name: Linux x64
            os: ubuntu-22.04
            artifact_name: openlabos-desktop-linux
            artifact_glob: |
              desktop/src-tauri/target/release/bundle/appimage/*.AppImage
              desktop/src-tauri/target/release/bundle/deb/*.deb
              desktop/src-tauri/target/release/bundle/rpm/*.rpm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            rpm \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Import Windows signing certificate
        if: runner.os == 'Windows'
        shell: powershell
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          $isReleaseTag = $env:GITHUB_REF -like "refs/tags/desktop-v*"
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) { $missing += "WINDOWS_CERTIFICATE" }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) { $missing += "WINDOWS_CERTIFICATE_PASSWORD" }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_THUMBPRINT)) { $missing += "WINDOWS_CERTIFICATE_THUMBPRINT" }
          if ($missing.Count -gt 0) {
            if ($isReleaseTag) {
              throw "Release tag builds require Windows signing secrets. Missing: $($missing -join ', ')"
            }
            Write-Host "Windows signing secrets are not configured; building unsigned artifacts."
            exit 0
          }
          New-Item -ItemType Directory -Force -Path certificate | Out-Null
          Set-Content -Path certificate\certificate-base64.txt -Value $env:WINDOWS_CERTIFICATE
          certutil -decode certificate\certificate-base64.txt certificate\certificate.pfx
          Import-PfxCertificate -FilePath certificate\certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText)

      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          missing=()
          [ -z "$APPLE_CERTIFICATE" ] && missing+=("APPLE_CERTIFICATE")
          [ -z "$APPLE_CERTIFICATE_PASSWORD" ] && missing+=("APPLE_CERTIFICATE_PASSWORD")
          [ -z "$KEYCHAIN_PASSWORD" ] && missing+=("KEYCHAIN_PASSWORD")
          if [ ${#missing[@]} -gt 0 ] && [[ "$GITHUB_REF" == refs/tags/desktop-v* ]]; then
            printf 'Release tag builds require macOS signing secrets. Missing: %s\n' "${missing[*]}"
            exit 1
          fi
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ] || [ -z "$KEYCHAIN_PASSWORD" ]; then
            echo "macOS signing secrets are not configured; building unsigned artifacts."
            exit 0
          fi
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          CERT_ID=$(security find-identity -v -p codesigning build.keychain | awk -F'"' '/Developer ID Application|Apple Distribution/ {print $2; exit}')
          if [ -z "$CERT_ID" ]; then
            echo "No Developer ID Application or Apple Distribution signing identity found."
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"

      - name: Prepare macOS notarization API key
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          has_apple_id_creds=false
          has_api_creds=false
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            has_apple_id_creds=true
          fi
          if [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_KEY_CONTENT" ]; then
            has_api_creds=true
          fi
          if [ "$has_apple_id_creds" != "true" ] && [ "$has_api_creds" != "true" ] && [[ "$GITHUB_REF" == refs/tags/desktop-v* ]]; then
            echo "Release tag builds require macOS notarization credentials: APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID or APPLE_API_ISSUER/APPLE_API_KEY/APPLE_API_KEY_CONTENT."
            exit 1
          fi
          if [ -z "$APPLE_API_KEY_CONTENT" ]; then
            echo "App Store Connect API key content is not configured."
            exit 0
          fi
          printf "%s" "$APPLE_API_KEY_CONTENT" > AuthKey.p8
          echo "APPLE_API_KEY_PATH=$PWD/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck web
        run: pnpm --filter @openlabos/web typecheck

      - name: Typecheck API
        run: pnpm --filter @openlabos/api typecheck

      - name: Typecheck desktop package
        run: pnpm desktop:typecheck

      - name: Prepare desktop runtime
        run: pnpm desktop:prepare-runtime

      - name: Verify bundled runtime
        run: pnpm desktop:verify-runtime

      - name: Build desktop bundle
        env:
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: pnpm desktop:build

      - name: Verify Windows signatures
        if: runner.os == 'Windows'
        shell: powershell
        env:
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_THUMBPRINT)) {
            Write-Host "Windows signing thumbprint is not configured; skipping signature verification."
            exit 0
          }
          $expected = $env:WINDOWS_CERTIFICATE_THUMBPRINT -replace '\s', ''
          $artifacts = @(Get-ChildItem -Path desktop/src-tauri/target/release/bundle -Recurse -File -Include *.msi,*.exe)
          if ($artifacts.Count -eq 0) {
            throw "No Windows artifacts found for signature verification."
          }
          foreach ($artifact in $artifacts) {
            $signature = Get-AuthenticodeSignature -FilePath $artifact.FullName
            if ($signature.Status -ne "Valid") {
              throw "Invalid signature for $($artifact.FullName): $($signature.Status)"
            }
            $actual = $signature.SignerCertificate.Thumbprint -replace '\s', ''
            if ($actual -ne $expected) {
              throw "Unexpected signing certificate for $($artifact.FullName): $actual"
            }
          }

      - name: Verify macOS signatures
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "macOS signing identity is not configured; skipping signature verification."
            exit 0
          fi
          found=0
          while IFS= read -r app; do
            found=1
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign --display --verbose=2 "$app"
          done < <(find desktop/src-tauri/target/release/bundle/macos -maxdepth 1 -name "*.app" -type d)
          if [ "$found" -eq 0 ]; then
            echo "No macOS .app bundle found for signature verification."
            exit 1
          fi

      - name: Generate artifact checksums
        run: pnpm desktop:hash-artifacts

      - name: Prepare release checksum artifact
        shell: pwsh
        run: |
          Copy-Item `
            -Path desktop/src-tauri/target/release/bundle/SHA256SUMS.txt `
            -Destination desktop/src-tauri/target/release/bundle/${{ matrix.artifact_name }}-SHA256SUMS.txt

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_glob }}
            desktop/src-tauri/target/release/bundle/${{ matrix.artifact_name }}-SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish desktop release assets
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.artifact_glob }}
            desktop/src-tauri/target/release/bundle/${{ matrix.artifact_name }}-SHA256SUMS.txt
          generate_release_notes: true
