name: openlabos

services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
      args:
        OPENLABOS_VERSION: ${OPENLABOS_VERSION:-local}
        GIT_REVISION: ${GIT_REVISION:-local}
    image: openlabos/api:local
    init: true
    restart: unless-stopped
    labels:
      org.opencontainers.image.title: "OpenLabOS API"
      org.opencontainers.image.source: "https://github.com/Caerii/OpenLabOS"
      org.opencontainers.image.version: "${OPENLABOS_VERSION:-local}"
      org.opencontainers.image.revision: "${GIT_REVISION:-local}"
      openlabos.component: "api"
    environment:
      CLOUD_MODE: "true"
      OPENLABOS_API_HOST: 0.0.0.0
      OPENLABOS_API_PORT: "3847"
      OPENLABOS_DATA_DIR: /workspace/services/api/data
      OPENLABOS_INFERENCE_URL: http://inference:8001
      LABOS_ENTITY_SEGMENTATION_MODE: sidecar
      LABOS_SEGMENTATION_SIDECAR_URL: http://perception:8002
      LABOS_SEGMENTATION_SIDECAR_TOKEN: ${LABOS_SEGMENTATION_TOKEN:-}
      LABOS_EXPERIENCE_PROFILE: ${LABOS_EXPERIENCE_PROFILE:-operator}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3847}
    ports:
      - "127.0.0.1:${OPENLABOS_PORT:-3847}:3847"
    volumes:
      - api-artifacts:/workspace/services/api/artifacts
      - api-data:/workspace/services/api/data
    depends_on:
      inference:
        condition: service_healthy
      perception:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3847/api/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 1G
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s

  inference:
    build:
      context: .
      dockerfile: services/inference/Dockerfile
      args:
        OPENLABOS_VERSION: ${OPENLABOS_VERSION:-local}
        GIT_REVISION: ${GIT_REVISION:-local}
    image: openlabos/inference:local
    init: true
    restart: unless-stopped
    labels:
      org.opencontainers.image.title: "OpenLabOS Inference"
      org.opencontainers.image.source: "https://github.com/Caerii/OpenLabOS"
      org.opencontainers.image.version: "${OPENLABOS_VERSION:-local}"
      org.opencontainers.image.revision: "${GIT_REVISION:-local}"
      openlabos.component: "inference"
    environment:
      OPENLABOS_INFERENCE_HOST: 0.0.0.0
      OPENLABOS_INFERENCE_PORT: "8001"
      OPENLABOS_PROVIDER: ${OPENLABOS_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2-vision}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/v1/healthz', timeout=2)"
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 2G
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s

  perception:
    build:
      context: .
      dockerfile: services/perception/Dockerfile
      args:
        OPENLABOS_VERSION: ${OPENLABOS_VERSION:-local}
        GIT_REVISION: ${GIT_REVISION:-local}
    image: openlabos/perception:local
    init: true
    restart: unless-stopped
    labels:
      org.opencontainers.image.title: "OpenLabOS Perception"
      org.opencontainers.image.source: "https://github.com/Caerii/OpenLabOS"
      org.opencontainers.image.version: "${OPENLABOS_VERSION:-local}"
      org.opencontainers.image.revision: "${GIT_REVISION:-local}"
      openlabos.component: "perception"
    environment:
      LABOS_SEGMENTATION_BACKEND: ${LABOS_SEGMENTATION_BACKEND:-mock}
      LABOS_SEGMENTATION_TOKEN: ${LABOS_SEGMENTATION_TOKEN:-}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=2)"
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 512M
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s

volumes:
  api-artifacts:
    name: openlabos-api-artifacts
  api-data:
    name: openlabos-api-data
