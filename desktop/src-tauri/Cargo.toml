[package]
name = "openlabos-desktop"
version = "0.1.0"
description = "Native desktop shell for OpenLabOS"
authors = ["OpenLabOS"]
edition = "2021"

[lib]
name = "labos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
