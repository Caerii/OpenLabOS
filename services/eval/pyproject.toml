[project]
name = "openlabos-eval"
version = "0.0.0"
description = "Evaluation harness for OpenLabOS: run metrics, hybrid validators, and regression suites."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.10.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
codegen = ["datamodel-code-generator[http]>=0.25"]

[project.scripts]
openlabos-eval-metrics = "openlabos_eval.run_metrics:main"

[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openlabos_eval"]
