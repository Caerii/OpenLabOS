[project]
name = "openlabos-training"
version = "0.0.0"
description = "Training stack for OpenLabOS: SFT, DPO, GRPO, and judgment LoRA, with dataset ingestion utilities."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.6.0",
  "datasets>=2.20.0",
  "transformers>=4.46.0",
  "accelerate>=0.34.0",
  "peft>=0.13.0",
  "trl>=0.9.0",
  "pydantic>=2.10.0",
  # Dataset ingestion (YouTube + frame extraction)
  "yt-dlp>=2025.1.26",
  "opencv-python-headless>=4.9.0.80,<5",
]

[project.optional-dependencies]
gpu = [
  "bitsandbytes>=0.43.0",
]
codegen = [
  "datamodel-code-generator[http]>=0.25",
  "pydantic>=2.10.0",
]

[project.scripts]
openlabos-training = "openlabos_training.cli:main"
openlabos-build-sft = "openlabos_training.build_sft_dataset:main"
openlabos-collect-dpo = "openlabos_training.collect_dpo_pairs:main"
openlabos-train-sft = "openlabos_training.train_sft:main"
openlabos-train-dpo = "openlabos_training.train_dpo:main"
openlabos-train-grpo = "openlabos_training.train_grpo:main"
openlabos-ingest-youtube = "openlabos_training.ingest_youtube:main"
openlabos-ingest-video-sources = "openlabos_training.ingest_video_sources:main"
openlabos-prepare-judgment-sft = "openlabos_training.judgment_sft_prepare:main"
openlabos-train-judgment-sft = "openlabos_training.train_judgment_sft:main"
openlabos-infer-hf-judgments = "openlabos_training.post_sft_infer:main"
openlabos-export-isaac-lab = "openlabos_training.isaac_lab_export:main"
openlabos-world-model-shootout = "openlabos_training.world_model.shootout:main"

[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openlabos_training"]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
